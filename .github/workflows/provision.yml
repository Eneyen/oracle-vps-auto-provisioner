name: Oracle VPS Auto Provisioner

on:
  schedule:
    # Cada ejecucion sondea 5 h 30 seguidas, asi que se lanza cada 6 horas:
    # si se lanzara cada 10 minutos (como antes) las ejecuciones se apilarian
    # en cola y GitHub iria cancelando las que esperan turno, enviando avisos
    # de "run cancelled" que parecen fallos y no lo son.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_runtime_seconds:
        description: 'Segundos maximos sondeando (prueba de diagnostico: 180)'
        required: false
        default: '19800'

# Evita que dos ejecuciones creen la instancia a la vez: la segunda espera.
concurrency:
  group: oracle-vps-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run provisioner
        env:
          ORACLE_USER_OCID: ${{ secrets.ORACLE_USER_OCID }}
          ORACLE_TENANCY_OCID: ${{ secrets.ORACLE_TENANCY_OCID }}
          ORACLE_API_FINGERPRINT: ${{ secrets.ORACLE_API_FINGERPRINT }}
          ORACLE_API_KEY: ${{ secrets.ORACLE_API_KEY }}
          ORACLE_COMPARTMENT_OCID: ${{ secrets.ORACLE_COMPARTMENT_OCID }}
          ORACLE_SUBNET_OCID: ${{ secrets.ORACLE_SUBNET_OCID }}
          ORACLE_IMAGE_ID: ${{ secrets.ORACLE_IMAGE_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          OCPU: '2'
          MEMORY_GB: '12'
          RETRY_DELAY_SECONDS: '60'
          MAX_RUNTIME_SECONDS: ${{ inputs.max_runtime_seconds || '19800' }}
        run: python oracle_provisioner.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provisioner-logs
          path: ~/.oci/provision.log
          retention-days: 7
          if-no-files-found: ignore
