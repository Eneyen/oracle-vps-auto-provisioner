name: Oracle VPS Auto Provisioner

on:
  schedule:
      - cron: '*/10 * * * *'
        workflow_dispatch:

        jobs:
          provision:
              runs-on: ubuntu-latest
                  steps:
                        - uses: actions/checkout@v3
                              - name: Set up Python
                                      uses: actions/setup-python@v4
                                              with:
                                                        python-version: '3.11'
                                                              - name: Install dependencies
                                                                      run: |
                                                                                python -m pip install --upgrade pip
                                                                                          pip install -r requirements.txt
                                                                                                - name: Create OCI Config Directory
                                                                                                        run: mkdir -p ~/.oci
                                                                                                              - name: Create OCI API Key
                                                                                                                      run: |
                                                                                                                                echo "${{ secrets.ORACLE_API_KEY }}" > ~/.oci/api_key.pem
                                                                                                                                          chmod 600 ~/.oci/api_key.pem
                                                                                                                                                - name: Run Oracle VPS Provisioner
                                                                                                                                                        env:
                                                                                                                                                                  ORACLE_USER_OCID: ${{ secrets.ORACLE_USER_OCID }}
                                                                                                                                                                            ORACLE_TENANCY_OCID: ${{ secrets.ORACLE_TENANCY_OCID }}
                                                                                                                                                                                      ORACLE_COMPARTMENT_OCID: ${{ secrets.ORACLE_COMPARTMENT_OCID }}
                                                                                                                                                                                                ORACLE_API_FINGERPRINT: ${{ secrets.ORACLE_API_FINGERPRINT }}
                                                                                                                                                                                                          ORACLE_SUBNET_OCID: ${{ secrets.ORACLE_SUBNET_OCID }}
                                                                                                                                                                                                                    ORACLE_IMAGE_ID: ${{ secrets.ORACLE_IMAGE_ID }}
                                                                                                                                                                                                                              EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
                                                                                                                                                                                                                                        EMAIL_TO: ${{ secrets.EMAIL_TO }}
                                                                                                                                                                                                                                                  EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
                                                                                                                                                                                                                                                          run: python oracle_provisioner.py
